<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Clubs</title>
</head>
<body>
<h1>Club List</h1>
<table>
    <tr>
        <th>Name</th>
        <th>Location</th>
        <th>Description</th>
    </tr>
    <tr th:each="club : ${clubs}">
        <td th:text="${club.name}">Club Name</td>
        <td th:text="${club.location}">Club Location</td>
        <td th:text="${club.description}">Club Description</td>
    </tr>
</table>

<h2>Add New Club</h2>
<form th:action="@{/clubs}" method="post">
    <label>Name: <input type="text" name="name"/></label><br/>
    <label>Location: <input type="text" name="location"/></label><br/>
    <label>Description: <input type="text" name="description"/></label><br/>
    <button type="submit">Add Club</button>
</form>
</body>
</html>
