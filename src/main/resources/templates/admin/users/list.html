<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유저 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<!-- 헤더 -->
<div th:replace="fragments/common-header :: header"></div>

<div class="container mt-5">
    <h1>유저 목록</h1>

    <!-- 로그인 정보 -->
    <div class="mb-3 text-end">
        <span th:text="'안녕하세요, ' + ${#authentication.name} + '님!'"></span>
    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>이름</th>
            <th>닉네임</th>
            <th>가입일</th>
            <th>정지 기간</th>
            <th>작업</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.username}"></td>
            <td th:text="${user.nickname}"></td>
            <td th:text="${#temporals.format(user.createTime, 'yyyy-MM-dd HH:mm')}"></td> <!-- 가입일 추가 -->
            <td th:text="${user.banEndTime != null ? #temporals.format(user.banEndTime, 'yyyy-MM-dd HH:mm') : '정상'}"></td> <!-- 정지기간 추가 -->
            <td>
                <form th:if="${user.banEndTime == null}" th:action="@{/admin/users/ban/{id}(id=${user.id})}" method="post" class="d-inline">
                    <input type="number" name="days" placeholder="일 수" min="1" required>
                    <button type="submit" class="btn btn-warning btn-sm">회원 정지</button>
                </form>
                <form th:if="${user.banEndTime != null}" th:action="@{/admin/users/unban/{id}(id=${user.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-success btn-sm">정지 해제</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
