<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/common-header :: header" th:with="pageTitle='마이페이지'"></head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">마이페이지</h2>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <script src="/js/common.js"></script>

    <form th:action="@{/mypage/edit}" th:object="${user}" method="post">
        <div class="mb-3">
            <label for="nickname" class="form-label">닉네임</label>
            <input type="text" class="form-control" id="nickname" th:field="*{nickname}"
                   pattern="^[가-힣]+$" placeholder="닉네임을 입력하세요" required>
            <button type="button" id="checkNicknameBtn" class="btn btn-secondary mt-2">중복 체크</button>
            <div id="nicknameCheckResult" class="mt-2"></div>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="비밀번호를 입력하세요" required>
            <div id="passwordCheckResult" class="mt-2 text-danger"></div>
        </div>

        <div class="mb-3">
            <label for="phoneNumber" class="form-label">핸드폰 번호</label>
            <input type="tel" class="form-control" id="phoneNumber" th:field="*{phoneNumber}"
                   placeholder="010-1234-5678" required>
            <button type="button" id="checkPhoneNumberBtn" class="btn btn-secondary mt-2">중복 체크</button>
            <div id="phoneNumberCheckResult" class="mt-2"></div>
        </div>

        <button type="submit" class="btn btn-primary w-100">수정하기</button>
    </form>
</div>

<script>
    // 비밀번호 유효성 검사
    const passwordInput = document.getElementById('password');
    const passwordCheckResult = document.getElementById('passwordCheckResult');

    passwordInput.addEventListener('input', function () {
        const password = passwordInput.value.trim();
        if (password.length < 8) {
            updateResult(passwordCheckResult, '비밀번호는 최소 8자 이상이어야 합니다.', 'text-danger');
        } else {
            updateResult(passwordCheckResult, '사용 가능한 비밀번호입니다.', 'text-success');
        }
    });

    // 닉네임 중복 체크
    const nicknameInput = document.getElementById('nickname');
    const nicknameCheckResult = document.getElementById('nicknameCheckResult');

    document.getElementById('checkNicknameBtn').addEventListener('click', async function () {
        const nickname = nicknameInput.value.trim();
        if (nickname.length < 2 || nickname.length > 6) {
            updateResult(nicknameCheckResult, '닉네임은 2자 이상, 6자 이하여야 합니다.', 'text-danger');
            return;
        }

        try {
            const response = await fetch(`/mypage/checkNickname?nickname=${encodeURIComponent(nickname)}`);
            const isAvailable = await response.json();
            if (isAvailable) {
                updateResult(nicknameCheckResult, '사용 가능한 닉네임입니다.', 'text-success');
            } else {
                updateResult(nicknameCheckResult, '이미 사용 중인 닉네임입니다.', 'text-danger');
            }
        } catch (error) {
            updateResult(nicknameCheckResult, '중복 체크에 실패했습니다.', 'text-danger');
        }
    });
    // Helper 함수 (결과 메시지 업데이트)
    function updateResult(element, message, className) {
        element.textContent = message;
        element.className = className;
    }
</script>

</body>
</html>
