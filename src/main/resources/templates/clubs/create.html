<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>클럽등록</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h2>클럽 등록하기</h2>
  <form th:action="@{/clubs/admin/new}" th:object="${club}" method="post">
    <div class="mb-3">
      <label for="name" class="form-label">이름</label>
      <input type="text" class="form-control" id="name" th:field="*{name}" required>
    </div>
    <div class="mb-3">
      <label for="location" class="form-label">주소</label>
      <input type="text" class="form-control" id="location" th:field="*{location}" required>
    </div>
    <div class="mb-3">
      <label for="description" class="form-label">설명</label>
      <textarea class="form-control" id="description" th:field="*{description}" required></textarea>
    </div>
    <div class="mb-3">
      <label for="callNumber" class="form-label">전화번호</label>
      <input type="text" class="form-control" id="callNumber" th:field="*{callNumber}" required>
    </div>
    <button type="submit" class="btn btn-primary">등록</button>
  </form>
</div>
</body>
</html>
