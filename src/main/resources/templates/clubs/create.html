<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>클럽 등록</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=93b4ad501fc7b3941109e59488da8aa9&libraries=services"></script>
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script src="/js/common.js"></script>
</head>
<body>
<div class="container">
  <!-- 공통 헤더 -->
  <div th:replace="fragments/common-header :: header"></div>

  <!-- 등록 폼 -->
  <form th:action="@{/clubs/admin/new}" th:object="${club}" method="post" enctype="multipart/form-data">
    <div class="mb-3">
      <label for="name" class="form-label">이름</label>
      <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="클럽 이름을 입력하세요" required>
    </div>

    <!-- 주소 검색 -->
    <div class="mb-3">
      <label for="address" class="form-label">주소 검색</label>
      <input type="text" class="form-control" id="address" name="location" placeholder="주소 검색" readonly required>
      <button type="button" id="searchAddress" class="btn btn-secondary mt-2">주소 검색</button>
    </div>

    <!-- 상세 주소 -->
    <div class="mb-3">
      <label for="detailedAddress" class="form-label">상세 주소</label>
      <input type="text" class="form-control" id="detailedAddress" name="detailedAddress" placeholder="상세 주소를 입력하세요">
    </div>

    <!-- 숨겨진 위도와 경도 필드 -->
    <input type="hidden" id="latitude" name="latitude" th:field="*{latitude}" />
    <input type="hidden" id="longitude" name="longitude" th:field="*{longitude}" />

    <div class="mb-3">
      <label for="description" class="form-label">설명</label>
      <textarea class="form-control" id="description" th:field="*{description}" rows="4" placeholder="클럽 설명을 입력하세요" required></textarea>
    </div>
    <div class="mb-3">
      <label for="callNumber" class="form-label">전화번호</label>
      <input type="text" class="form-control" id="callNumber" th:field="*{callNumber}" placeholder="전화번호를 입력하세요" required>
    </div>
    <div class="mb-3">
      <label for="file" class="form-label">사진 첨부</label>
      <input type="file" class="form-control" id="file" name="file" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">등록</button>
  </form>
</div>

<!-- 공통 스크립트 -->
<script>
  initAddressSearch('searchAddress', 'address', 'latitude', 'longitude');
</script>
</body>
</html>
