<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>클럽 수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=93b4ad501fc7b3941109e59488da8aa9&libraries=services"></script>
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</head>
<body>
<div class="container mt-5">
    <h2>클럽 수정</h2>
    <form th:action="@{/clubs/admin/edit/{id}(id=${clubId})}" th:object="${club}" method="post" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="name" class="form-label">이름</label>
            <input type="text" class="form-control" id="name" th:field="*{name}" required>
        </div>

        <div class="mb-3">
            <label for="address" class="form-label">주소 검색</label>
            <input type="text" class="form-control" id="address" th:field="*{location}" readonly required>
            <button type="button" id="searchAddress" class="btn btn-secondary mt-2">주소 검색</button>
        </div>

        <input type="hidden" id="latitude" name="latitude" th:field="*{latitude}">
        <input type="hidden" id="longitude" name="longitude" th:field="*{longitude}">

        <div class="mb-3">
            <label for="description" class="form-label">설명</label>
            <textarea class="form-control" id="description" th:field="*{description}" required></textarea>
        </div>

        <div class="mb-3">
            <label for="callNumber" class="form-label">전화번호</label>
            <input type="text" class="form-control" id="callNumber" th:field="*{callNumber}" required>
        </div>

        <div class="mb-3">
            <label for="clubImage" class="form-label">현재 사진</label>
            <img id="clubImage" th:src="${club.photoUrl}" alt="현재 사진" style="max-width: 200px; max-height: 200px;">
        </div>

        <div class="mb-3">
            <label for="file" class="form-label">사진 변경</label>
            <input type="file" class="form-control" id="file" name="file">
        </div>

        <button type="submit" class="btn btn-primary">수정</button>
    </form>
</div>

<script>
    document.getElementById('searchAddress').addEventListener('click', function () {
        new daum.Postcode({
            oncomplete: function (data) {
                document.getElementById('address').value = data.address;

                const geocoder = new kakao.maps.services.Geocoder();
                geocoder.addressSearch(data.address, function (result, status) {
                    if (status === kakao.maps.services.Status.OK) {
                        document.getElementById('latitude').value = result[0].y;
                        document.getElementById('longitude').value = result[0].x;
                    } else {
                        alert('주소를 변환하는 데 실패했습니다.');
                    }
                });
            }
        }).open();
    });
</script>
</body>
</html>
