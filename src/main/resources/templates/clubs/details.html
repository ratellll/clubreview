<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>클럽 상세보기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 th:text="${club.name}">클럽이름</h1>
    <p><strong>주소:</strong> <span th:text="${club.location}"></span></p>
    <p><strong>설명:</strong> <span th:text="${club.description}"></span></p>
    <p><strong>전화번호 :</strong> <span th:text="${club.callNumber}"></span></p>
    <p><strong>평균 별점:</strong> <span th:text="${club.averageRating}"></span></p>

    <h3>리뷰</h3>
    <ul class="list-group mb-4">
        <li class="list-group-item" th:each="review : ${reviews}">
            <strong th:text="${review.user.username}">User</strong>:
            <span th:text="${review.comment}">리뷰</span>
            <span th:text="'(' + ${review.rating} + '/5)'">별점</span>
        </li>
    </ul>

    <!-- 리뷰 작성 폼 -->
    <h3>리뷰 작성</h3>
    <form th:action="@{/reviews/add}" method="post">
        <input type="hidden" th:name="clubId" th:value="${club.id}"/> <!-- 클럽 ID -->
        <div class="mb-3">
            <label for="rating" class="form-label">별점 (1-5)</label>
            <select id="rating" name="rating" class="form-select" required>
                <option value="1">1점</option>
                <option value="2">2점</option>
                <option value="3">3점</option>
                <option value="4">4점</option>
                <option value="5">5점</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="comment" class="form-label">리뷰</label>
            <textarea id="comment" name="comment" class="form-control" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">리뷰 등록</button>
    </form>
</div>

<!-- Bootstrap JavaScript with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
