<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">클럽의 민족</title>
    <link href="/css/styles.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!-- 헤더 프래그먼트 삽입 -->
<div th:replace="fragments/common-header :: header"></div>

<div class="container mt-5">
    <!-- 성공 및 오류 메시지 처리 -->
    <div th:if="${message}" class="alert alert-success" role="alert" th:text="${message}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

    <h1 class="text-center mb-4">클럽의 민족</h1>

    <!-- 로그인 및 회원가입 섹션 -->
    <div class="row mt-4">
        <!-- 로그인 폼 -->
        <div class="col-md-6">
            <h2>로그인</h2>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">아이디</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="아이디를 입력하세요" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">비밀번호</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">로그인</button>
            </form>
        </div>

        <!-- 회원가입 버튼 -->
        <div class="col-md-6 text-center">
            <h2>신규 회원가입</h2>
            <p>클럽 리뷰를 작성하려면 계정을 생성하세요!</p>
            <a th:href="@{/users/register}" class="btn btn-secondary btn-lg w-100 mt-4">회원가입</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
