<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${club.name}">클럽 상세 정보</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<!-- 헤더 -->
<div th:replace="fragments/common-header :: header"></div>

<!-- 컨텐츠 -->
<div class="container mt-5">
    <div class="row">
        <div class="col-md-8">
            <h1 th:text="${club.name}">클럽 이름</h1>
            <p th:text="'위치: ' + ${club.location}">위치 정보</p>
            <p th:text="'전화번호: ' + ${club.callNumber}">전화번호</p>
            <p th:text="'평점: ' + ${club.averageRating} + ' / 5'">평점</p>
            <p th:text="'설명: ' + ${club.description}">클럽 설명</p>
        </div>
        <div class="col-md-4">
            <img th:src="${club.photoUrl}" class="img-fluid rounded" alt="클럽 사진">
        </div>
    </div>

    <!-- 리뷰 목록 -->
    <div class="mt-5">
        <h2>리뷰</h2>
        <div th:if="${#lists.isEmpty(reviews)}">
            <p class="text-muted">등록된 리뷰가 없습니다.</p>
        </div>
        <ul class="list-group" th:each="review : ${reviews}">
            <li class="list-group-item">
                <p><strong th:text="${review.user.nickname}">사용자 이름</strong></p>
                <p>
                    <span th:each="star : ${#numbers.sequence(1, review.rating)}" class="text-warning">★</span>
                    <span th:if="${review.rating < 5}"
                          th:each="star : ${#numbers.sequence(review.rating + 1, 5)}"
                          class="text-muted">★</span>
                </p>
                <p th:text="${review.comment}">리뷰 내용</p>
                <p class="text-muted" th:text="${#temporals.format(review.createTime, 'yyyy-MM-dd HH:mm')}">작성 날짜</p>

                <!-- 사용자 리뷰 수정/삭제 -->
                <div th:if="${#authentication.name == review.user.username}">
                    <button class="btn btn-warning" onclick="toggleEditForm(this)">수정</button>
                    <form th:action="@{/reviews/user/delete/{id}(id=${review.id})}" method="post" class="d-inline">
                        <input type="hidden" name="clubId" th:value="${club.id}">
                        <button type="submit" class="btn btn-danger">삭제</button>
                    </form>
                </div>

                <!-- 관리자 수정/삭제 -->
                <div sec:authorize="hasRole('ADMIN')">
                    <button class="btn btn-primary ms-3" onclick="toggleAdminEditForm(this)">관리자 수정</button>
                    <form th:action="@{/reviews/admin/delete/{id}(id=${review.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-danger">관리자 삭제</button>
                    </form>
                </div>

                <!-- 사용자 수정 폼 -->
                <form th:action="@{/reviews/user/edit/{id}(id=${review.id})}" method="post" class="mt-3 d-none edit-form">
                    <input type="hidden" name="clubId" th:value="${club.id}">
                    <div class="mb-3">
                        <label for="rating-${review.id}" class="form-label">평점</label>
                        <select class="form-select" id="rating-${review.id}" name="rating" required>
                            <option value="5" th:selected="${review.rating == 5}">★★★★★ (5점)</option>
                            <option value="4" th:selected="${review.rating == 4}">★★★★☆ (4점)</option>
                            <option value="3" th:selected="${review.rating == 3}">★★★☆☆ (3점)</option>
                            <option value="2" th:selected="${review.rating == 2}">★★☆☆☆ (2점)</option>
                            <option value="1" th:selected="${review.rating == 1}">★☆☆☆☆ (1점)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <textarea class="form-control" name="comment" rows="3" required th:text="${review.comment}"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">수정 완료</button>
                    <button type="button" class="btn btn-secondary" onclick="toggleEditForm(this)">취소</button>
                </form>

                <!-- 관리자 수정 폼 -->
                <form th:action="@{/reviews/admin/edit/{id}(id=${review.id})}" method="post" class="mt-3 d-none edit-form">
                    <div class="mb-3">
                        <label for="admin-rating-${review.id}" class="form-label">평점</label>
                        <select class="form-select" id="admin-rating-${review.id}" name="rating" required>
                            <option value="5" th:selected="${review.rating == 5}">★★★★★ (5점)</option>
                            <option value="4" th:selected="${review.rating == 4}">★★★★☆ (4점)</option>
                            <option value="3" th:selected="${review.rating == 3}">★★★☆☆ (3점)</option>
                            <option value="2" th:selected="${review.rating == 2}">★★☆☆☆ (2점)</option>
                            <option value="1" th:selected="${review.rating == 1}">★☆☆☆☆ (1점)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <textarea class="form-control" name="comment" rows="3" required th:text="${review.comment}"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">관리자 수정 완료</button>
                    <button type="button" class="btn btn-secondary" onclick="toggleAdminEditForm(this)">취소</button>
                </form>
            </li>
        </ul>
    </div>

    <!-- 리뷰 작성 폼 -->
    <div class="mt-4" sec:authorize="isAuthenticated()">
        <h3>리뷰 작성</h3>
        <form th:action="@{/reviews/add}" method="post">
            <input type="hidden" name="clubId" th:value="${club.id}">
            <div class="mb-3">
                <label for="rating" class="form-label">평점</label>
                <select class="form-select" id="rating" name="rating" required>
                    <option value="5">★★★★★ (5점)</option>
                    <option value="4">★★★★☆ (4점)</option>
                    <option value="3">★★★☆☆ (3점)</option>
                    <option value="2">★★☆☆☆ (2점)</option>
                    <option value="1">★☆☆☆☆ (1점)</option>
                </select>
            </div>
            <div class="mb-3">
                <textarea class="form-control" name="comment" rows="3" placeholder="리뷰를 작성하세요" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">리뷰 등록</button>
        </form>
    </div>

    <!-- 로그인 유도 -->
    <div class="mt-4" th:if="${!#authorization.expression('isAuthenticated()')}">
        <p class="text-danger">리뷰를 작성하려면 <a th:href="@{/login}">로그인</a>이 필요합니다.</p>
    </div>
</div>

<script>
    function closeAllForms() {
        document.querySelectorAll('.edit-form').forEach(form => form.classList.add('d-none'));
    }

    function toggleEditForm(button) {
        closeAllForms(); // 모든 폼 닫기
        const reviewItem = button.closest('li');
        if (!reviewItem) return;

        const editForm = reviewItem.querySelector('.edit-form');
        if (editForm) editForm.classList.toggle('d-none');
    }

    function toggleAdminEditForm(button) {
        closeAllForms(); // 모든 폼 닫기
        const reviewItem = button.closest('li');
        if (!reviewItem) return;

        const editForm = reviewItem.querySelector('.edit-form');
        if (editForm) editForm.classList.toggle('d-none');
    }
</script>
</body>
</html>
