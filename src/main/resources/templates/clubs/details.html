<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${club.name}">클럽 상세 정보</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<!-- 헤더 -->
<div th:replace="fragments/common-header :: header"></div>

<!-- 컨텐츠 -->
<div class="container mt-5">
    <div class="row">
        <div class="col-md-8">
            <h1 th:text="${club.name}">클럽 이름</h1>
            <p th:text="'위치: ' + ${club.location}">위치 정보</p>
            <p th:text="'전화번호: ' + ${club.callNumber}">전화번호</p>
            <p th:text="'평점: ' + ${club.averageRating} + ' / 5'">평점</p>
            <p th:text="'설명: ' + ${club.description}">클럽 설명</p>
        </div>
        <div class="col-md-4">
            <img th:src="${club.photoUrl}" class="img-fluid rounded" alt="클럽 사진">
        </div>
    </div>

    <!-- 리뷰 목록 -->
    <div class="mt-5">
        <h2>리뷰</h2>
        <div th:if="${#lists.isEmpty(reviews)}">
            <p class="text-muted">등록된 리뷰가 없습니다.</p>
        </div>
        <ul class="list-group" th:each="review : ${reviews}">
            <li class="list-group-item">
                <p><strong th:text="${review.user.username}">사용자 이름</strong></p>
                <p th:text="${review.content}">리뷰 내용</p>
                <p class="text-muted" th:text="${review.createdDate}">작성 날짜</p>
            </li>
        </ul>
    </div>

    <!-- 리뷰 작성 폼 -->
    <div class="mt-4" sec:authorize="isAuthenticated()">
        <h3>리뷰 작성</h3>
        <form th:action="@{/reviews/add}" method="post">
            <input type="hidden" name="clubId" th:value="${club.id}">
            <div class="mb-3">
                <textarea class="form-control" name="content" rows="3" placeholder="리뷰를 작성하세요" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">리뷰 등록</button>
        </form>
    </div>

    <!-- 로그인 유도 -->
    <div class="mt-4" th:if="${!#authorization.expression('isAuthenticated()')}">
        <p class="text-danger">리뷰를 작성하려면 <a th:href="@{/login}">로그인</a>이 필요합니다.</p>
    </div>
</div>
</body>
</html>
