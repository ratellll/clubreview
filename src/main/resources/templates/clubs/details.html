<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Club Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 th:text="${club.name}">Club Name</h1>
    <p><strong>Location:</strong> <span th:text="${club.location}"></span></p>
    <p><strong>Description:</strong> <span th:text="${club.description}"></span></p>
    <p><strong>Phone Number:</strong> <span th:text="${club.callNumber}"></span></p>
    <p><strong>Average Rating:</strong> <span th:text="${club.averageRating}"></span></p>

    <h3>Reviews</h3>
    <ul class="list-group">
        <li class="list-group-item" th:each="review : ${reviews}">
            <strong th:text="${review.user.username}">User</strong>:
            <span th:text="${review.comment}">Review Comment</span>
            <span th:text="'(' + review.rating + '/5)'"></span>
        </li>
    </ul>
</div>
</body>
</html>
