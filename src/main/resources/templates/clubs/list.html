<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Clubs List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">



    <h1>클럽 목록</h1>
    <!-- 카카오 지도 API -->
    <div id="map" style="width:100%;height:500px;"></div>
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=93b4ad501fc7b3941109e59488da8aa9"></script>



    <script th:inline="javascript">
        // 클럽 데이터
        const clubs = /*[[${clubLocations}]]*/[];
        console.log(clubs);

        // 지도 초기화
        const container = document.getElementById('map');
        const options = {
            center: new kakao.maps.LatLng(37.5665, 126.9780), // 서울의 기본 중심좌표
            level: 8 // 확대 수준
        };

        const map = new kakao.maps.Map(container, options);

        // 현재 열려있는 정보창을 관리할 변수
        let currentInfoWindow = null;

        // 클럽 데이터로 마커 생성 및 커스텀 정보창 설정
        clubs.forEach(club => {
            const markerPosition = new kakao.maps.LatLng(club.latitude, club.longitude);

            // 마커 생성
            const marker = new kakao.maps.Marker({
                position: markerPosition,
                map: map
            });

            // 리뷰 HTML 생성
            const reviewsHtml = club.reviews.map(review => `
            <div class="review-item">
                <strong>${review.user}</strong>: <span>${review.comment} (${review.rating}/5)</span>
            </div>
        `).join('');

            // 커스텀 정보창 HTML
            const infoWindowContent = `
            <div class="info-window">
                <h4>${club.name}</h4>
                <p>위치: ${club.location}</p>
                <p>전화번호: ${club.callNumber}</p>
                <p>정보: ${club.description}</p>
                <p>평점: ${club.averageRating} / 5</p>
                <div class="reviews">
                    <h5 style="margin: 0;">리뷰</h5>
                    ${reviewsHtml || '<p>리뷰가 없습니다.</p>'}
                </div>
            </div>
        `;

            // 커스텀 정보창 생성
            const infoWindow = new kakao.maps.InfoWindow({
                content: infoWindowContent
            });

            // 마커 클릭 이벤트
            kakao.maps.event.addListener(marker, 'click', () => {
                // 기존 열려있는 정보창 닫기
                if (currentInfoWindow) {
                    currentInfoWindow.close();
                }

                // 현재 정보창 열기
                infoWindow.open(map, marker);

                // 현재 열려있는 정보창 업데이트
                currentInfoWindow = infoWindow;
            });
        });
    </script>

    <div class="mb-3">
        <a href="?sortBy=name" class="btn btn-secondary">이름 순 정렬</a>
        <a href="?sortBy=rating" class="btn btn-secondary">별점 순 정렬</a>
    </div>


    <!-- 클럽 리스트 -->
    <ul class="list-group">
        <li class="list-group-item" th:each="club : ${clubs.content}">
            <a th:href="@{/clubs/{id}(id=${club.id})}" th:text="${club.name}">클럽 이름</a>
            <span th:text="' - Rating: ' + ${club.averageRating}">평점</span>
        </li>
    </ul>

    <!-- 페이지 네비게이션 -->
    <div class="mt-3">
        <a th:if="${clubs.hasPrevious()}"
           th:href="@{/clubs/list(sortBy=${sortBy}, page=${clubs.pageable.pageNumber - 1})}"
           class="btn btn-outline-secondary">이전</a>

        <!-- 페이지 번호 링크 생성 -->
        <span th:each="pageNum : ${#numbers.sequence(0, clubs.totalPages - 1)}">
            <a th:href="@{/clubs/list(sortBy=${sortBy}, page=${pageNum})}"
               th:text="${pageNum + 1}"
               th:classappend="${pageNum == clubs.pageable.pageNumber} ? 'btn-primary' : 'btn-outline-secondary'"
               class="btn btn-sm mx-1"></a>
        </span>

        <!-- 다음 버튼 -->
        <a th:if="${clubs.hasNext()}"
           th:href="@{/clubs/list(sortBy=${sortBy}, page=${clubs.pageable.pageNumber + 1})}"
           class="btn btn-outline-secondary">다음</a>
    </div>
</div>
</body>
</html>
