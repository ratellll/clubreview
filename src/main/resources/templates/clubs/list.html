<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">클럽 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<!-- 헤더 -->
<div th:replace="fragments/common-header :: header"></div>

<!-- 컨텐츠 -->
<div class="container mt-5">
    <h1 class="mb-4">클럽 목록</h1>

    <!-- 지도 -->
    <div id="map" style="width:100%;height:500px;"></div>

    <!-- Kakao 지도 API -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=93b4ad501fc7b3941109e59488da8aa9&autoload=false"></script>

    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function () {
            kakao.maps.load(initMap);
        });

        function initMap() {
            console.log("✅ Kakao API 로드 완료!");
            const clubs = /*[[${clubLocations}]]*/ []; // 클럽 위치 데이터

            const container = document.getElementById('map'); // 지도 컨테이너
            const options = {
                center: new kakao.maps.LatLng(37.5665, 126.9780), // 지도 중심
                level: 8 // 지도 줌 레벨
            };

            const map = new kakao.maps.Map(container, options);

            let currentInfoWindow = null; // 현재 열려 있는 정보창
            let currentModal = null; // 현재 활성 모달 추적

            // 클럽 데이터를 기반으로 마커와 정보창 생성
            clubs.forEach(club => {
                const marker = new kakao.maps.Marker({
                    position: new kakao.maps.LatLng(club.latitude, club.longitude),
                    map: map
                });

                const infoWindowContent = `
                    <div class="info-window">
                        <h4><a href="/clubs/${club.id}" class="text-decoration-none">${club.name}</a></h4>
                        <p>위치: ${club.location}</p>
                        <p>전화번호: ${club.callNumber}</p>
                        <p>정보: ${club.description}</p>
                        <p>평점: ${club.averageRating} / 5</p>
                        <img src="${club.photoUrl}" alt="클럽 사진" onclick="showPhotoModal('${club.photoUrl}')">
                    </div>
                `;

                const infoWindow = new kakao.maps.InfoWindow({ content: infoWindowContent });

                // 마커 클릭 이벤트
                kakao.maps.event.addListener(marker, 'click', () => {
                    if (currentInfoWindow) {
                        currentInfoWindow.close();
                    }
                    infoWindow.open(map, marker);
                    currentInfoWindow = infoWindow;
                });

                // 지도 클릭 시 정보창 닫기
                kakao.maps.event.addListener(map, 'click', () => {
                    if (currentInfoWindow) {
                        currentInfoWindow.close();
                        currentInfoWindow = null;
                    }
                });
            });
        }

        // 사진 확대용 모달
        function showPhotoModal(photoUrl) {
            if (currentModal) {
                currentModal.remove();
                currentModal = null;
            }

            const modal = document.createElement('div');
            modal.className = 'photo-modal';
            modal.innerHTML = `<div class="photo-modal-content"><img src="${photoUrl}" alt="클럽 사진 확대"></div>`;

            // ESC 키로 모달 닫기 이벤트
            const handleEscKey = (event) => {
                if (event.key === "Escape") {
                    closeModal(modal, handleEscKey);
                }
            };

            modal.addEventListener('click', () => {
                closeModal(modal, handleEscKey);
            });

            document.addEventListener('keydown', handleEscKey);
            document.body.appendChild(modal);
            currentModal = modal;
        }

        function closeModal(modal, handleEscKey) {
            modal.remove();
            currentModal = null;
            document.removeEventListener('keydown', handleEscKey);
        }
    </script>

    <!-- 정렬 버튼 -->
    <div class="mb-4">
        <a href="?sortBy=name" class="btn btn-secondary">이름 순 정렬</a>
        <a href="?sortBy=rating" class="btn btn-secondary">평점 순 정렬</a>
        <a th:href="@{/clubs/admin/new}" class="btn btn-primary ms-3" sec:authorize="hasRole('ADMIN')">+ 클럽 등록</a>
    </div>

    <!-- 클럽 리스트 -->
    <ul class="list-group">
        <li class="list-group-item" th:each="club : ${clubs.content}">
            <a th:href="@{/clubs/{id}(id=${club.id})}" class="text-decoration-none" th:text="${club.name}">클럽 이름</a>
            <span class="ms-2 text-muted" th:text="'평점: ' + ${club.averageRating} + ' / 5'"></span>
            <td>
                <form th:action="@{/clubs/admin/delete/{id}(id=${club.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-warning btn-sm" sec:authorize="hasRole('ADMIN')">클럽 삭제</button>
                </form>
                <a th:href="@{/clubs/admin/edit/{id}(id=${club.id})}" class="btn btn-info btn-sm ms-1" sec:authorize="hasRole('ADMIN')">클럽 수정</a>
            </td>
        </li>
    </ul>

    <!-- 페이지 네비게이션 -->
    <div class="mt-4">
        <a th:if="${clubs.hasPrevious()}" th:href="@{/clubs/list(sortBy=${sortBy}, page=${clubs.pageable.pageNumber - 1})}" class="btn btn-outline-secondary">이전</a>
        <span th:each="pageNum : ${#numbers.sequence(0, clubs.totalPages - 1)}">
            <a th:href="@{/clubs/list(sortBy=${sortBy}, page=${pageNum})}" th:text="${pageNum + 1}" th:classappend="${pageNum == clubs.pageable.pageNumber} ? 'btn-primary' : 'btn-outline-secondary'" class="btn btn-sm mx-1"></a>
        </span>
        <a th:if="${clubs.hasNext()}" th:href="@{/clubs/list(sortBy=${sortBy}, page=${clubs.pageable.pageNumber + 1})}" class="btn btn-outline-secondary">다음</a>
    </div>
</div>

</body>
</html>
