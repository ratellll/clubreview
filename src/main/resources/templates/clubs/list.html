<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Clubs List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>클럽 목록</h1>
    <div class="mb-3">
        <a href="?sortBy=name" class="btn btn-secondary">이름 순 정렬</a>
        <a href="?sortBy=rating" class="btn btn-secondary">별점 순 정렬</a>
    </div>
    <ul class="list-group">
        <li class="list-group-item" th:each="club : ${clubs.content}">
            <a th:href="@{/clubs/{id}(id=${club.id})}" th:text="${club.name}"></a>
            <span th:text="' - Rating: ' + ${club.averageRating}"></span>
        </li>
    </ul>
    <div>
        <span th:if="${clubs.hasPrevious()}" th:text="|<" th:href="@{/clubs?page=${clubs.previousPageable().pageNumber}}">Previous</span>
        <span th:if="${clubs.hasNext()}" th:text=">|" th:href="@{/clubs?page=${clubs.nextPageable().pageNumber}}">Next</span>
    </div>
</div>
</body>
</html>
