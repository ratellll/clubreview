<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Clubs List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>클럽 목록</h1>
    <div class="mb-3">
        <a href="?sortBy=name" class="btn btn-secondary">이름 순 정렬</a>
        <a href="?sortBy=rating" class="btn btn-secondary">별점 순 정렬</a>
    </div>

    <!-- 클럽 리스트 -->
    <ul class="list-group">
        <li class="list-group-item" th:each="club : ${clubs.content}">
            <a th:href="@{/clubs/{id}(id=${club.id})}" th:text="${club.name}">클럽 이름</a>
            <span th:text="' - Rating: ' + ${club.averageRating}">평점</span>
        </li>
    </ul>

    <!-- 페이지 네비게이션 -->
    <div class="mt-3">
        <a th:if="${clubs.hasPrevious()}"
           th:href="@{/clubs(page=${clubs.previousPageable.pageNumber})}"
           class="btn btn-outline-secondary">이전</a>
        <span th:if="${!clubs.hasPrevious()}" class="text-muted">첫 페이지입니다</span>

        <a th:if="${clubs.hasNext()}"
           th:href="@{/clubs(page=${clubs.nextPageable.pageNumber})}"
           class="btn btn-outline-secondary">다음</a>
        <span th:if="${!clubs.hasNext()}" class="text-muted">다음 페이지가 없습니다</span>
    </div>
</div>
</body>
</html>
