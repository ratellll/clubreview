<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="header">
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand"
         th:href="${#authentication.authenticated} ? '/clubs/list' : '/'"
         onclick="return checkLogin()">클럽의 민족</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <!-- 클럽 목록 -->
          <li class="nav-item">
            <a th:href="@{/clubs/list}" class="nav-link" onclick="return checkLogin()">클럽 목록</a>
          </li>
          <!-- 로그인 상태 확인 -->
          <li class="nav-item" sec:authorize="isAnonymous()">
            <a th:href="@{/login}" class="nav-link">로그인</a>
          </li>
          <li class="nav-item" sec:authorize="isAuthenticated()">
            <a th:href="@{/logout}" class="nav-link">로그아웃</a>
          </li>
          <!-- 회원가입 버튼 (비로그인 사용자만 표시) -->
          <li class="nav-item" sec:authorize="isAnonymous()">
            <a th:href="@{/users/register}" class="nav-link">회원가입</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</div>

<!-- JavaScript for login check -->
<script th:inline="javascript">
  function checkLogin() {
    /* Check Spring Security authentication state */
    const isLoggedIn = /*[[${#authentication.authenticated}]]*/ false;
    if (!isLoggedIn) {
      alert('로그인이 필요합니다.');
      return false; // Prevent navigation
    }
    return true; // Allow navigation
  }
</script>
</body>
</html>
