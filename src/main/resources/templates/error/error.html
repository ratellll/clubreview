<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'에러: ' + ${status}">에러</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container text-center mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1 class="display-1 text-warning fw-bold" th:text="${status}">에러</h1>
            <h2 class="mt-3">요청 처리 중 문제가 발생했습니다</h2>
            <p class="text-muted mt-3" th:text="'오류 메시지: ' + ${message}">오류 메시지</p>
            <p class="text-muted" th:text="'요청 경로: ' + ${path}">요청 경로</p>
            <a th:href="@{/}" class="btn btn-outline-primary btn-lg mt-4">홈으로 돌아가기</a>
        </div>
    </div>
</div>
</body>
</html>
