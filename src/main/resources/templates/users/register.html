<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/common-header :: header" th:with="pageTitle='회원가입'"></head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">회원가입</h2>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <script src="/js/common.js"></script>

    <form th:action="@{/users/register}" th:object="${user}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">아이디</label>
            <input type="text" class="form-control" id="username" th:field="*{username}" placeholder="아이디를 입력하세요" required>
            <button type="button" id="checkUsernameBtn" class="btn btn-secondary mt-2">중복 체크</button>
            <div id="usernameCheckResult" class="mt-2"></div>
        </div>
                <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="비밀번호를 입력하세요" required>
            <div id="passwordCheckResult" class="mt-2 text-danger"></div>
        </div>
        <div class="mb-3">
            <label for="nickname" class="form-label">닉네임</label>
            <input type="text" class="form-control" id="nickname" th:field="*{nickname}"
                   pattern="^[가-힣]+$" title="한글만 입력해주세요." placeholder="닉네임을 입력하세요" required>
            <button type="button" id="checkNicknameBtn" class="btn btn-secondary mt-2">중복 체크</button>
            <div id="nicknameCheckResult" class="mt-2"></div>
        </div>
        <div class="mb-3">
            <label for="phoneNumber" class="form-label">휴대폰 번호</label>
            <input
                    type="tel"
                    class="form-control"
                    id="phoneNumber"
                    name="phoneNumber"
                    placeholder="01012345678 또는 010-1234-5678"
                    pattern="[0-9]{3}-?[0-9]{3,4}-?[0-9]{4}"
                    required
            >
            <button type="button" id="checkPhoneNumberBtn" class="btn btn-secondary mt-2">중복 체크</button>
            <div id="phoneNumberCheckResult" class="mt-2"></div>
            <div class="form-text">숫자 11자리를 입력해주세요. 예: 01012345678 또는 010-1234-5678</div>
        </div>
        <button type="submit" class="btn btn-primary w-100">회원가입</button>
    </form>
</div>

<script>
    // 중복 체크 상태 변수
    let isUsernameAvailable = false;
    let isPhoneNumberAvailable = false;
    let isNicknameAvailable = false;
    let isPasswordValid = false;

    // 비밀번호 유효성 체크 로직
    const passwordInput = document.getElementById('password');
    const passwordCheckResult = document.getElementById('passwordCheckResult');

    passwordInput.addEventListener('input', function () {
        const password = passwordInput.value.trim();
        if (password.length < 8) {
            passwordCheckResult.textContent = '비밀번호는 최소 8자 이상이어야 합니다.';
            passwordCheckResult.classList.add('text-danger');
            passwordCheckResult.classList.remove('text-success');
            isPasswordValid = false;
        } else {
            passwordCheckResult.textContent = '사용 가능한 비밀번호입니다.';
            passwordCheckResult.classList.add('text-success');
            passwordCheckResult.classList.remove('text-danger');
            isPasswordValid = true;
        }
    });
    // 아이디 중복 체크
    document.getElementById('checkUsernameBtn').addEventListener('click', async function () {
        const usernameInput = document.getElementById('username');
        const resultDiv = document.getElementById('usernameCheckResult');
        const username = usernameInput.value.trim();

        if (!username) {
            updateResult(resultDiv, '아이디를 입력하세요.', 'text-danger');
            isUsernameAvailable = false;
            return;
        }

        try {
            const response = await fetch(`/users/register/idCheck?username=${encodeURIComponent(username)}`);
            if (!response.ok) {
                throw new Error('서버 요청에 실패했습니다.');
            }

            const idIsFine = await response.json();
            if (idIsFine) {
                updateResult(resultDiv, '사용 가능한 아이디입니다.', 'text-success');
                isUsernameAvailable = true;

                // 입력란과 버튼 비활성화
                usernameInput.readonly = true;
                this.readonly = true;
            } else {
                updateResult(resultDiv, '이미 사용 중인 아이디입니다.', 'text-danger');
                isUsernameAvailable = false;
            }
        } catch (error) {
            updateResult(resultDiv, '중복 체크에 실패했습니다. 다시 시도하세요.', 'text-danger');
            isUsernameAvailable = false;
        }
    });

    // 닉네임 중복 체크
    document.getElementById('checkNicknameBtn').addEventListener('click', async function () {
        const nicknameInput = document.getElementById('nickname');
        const resultDiv = document.getElementById('nicknameCheckResult');
        const nickname = nicknameInput.value.trim();

        if (!nickname) {
            updateResult(resultDiv, '닉네임을 입력하세요.', 'text-danger');
            isNicknameAvailable = false;
            return;
        }

        try {
            const response = await fetch(`/users/register/nickCheck?nickname=${encodeURIComponent(nickname)}`);
            if (!response.ok) {
                throw new Error('서버 요청에 실패했습니다.');
            }

            const nicknameIsFine = await response.json();
            if (nicknameIsFine) {
                updateResult(resultDiv, '사용 가능한 닉네임입니다.', 'text-success');
                isNicknameAvailable = true;

                // 입력란과 버튼 비활성화
                nicknameInput.readonly = true;
                this.readonly = true;
            } else {
                updateResult(resultDiv, '이미 사용 중인 닉네임입니다.', 'text-danger');
                isNicknameAvailable = false;
            }
        } catch (error) {
            updateResult(resultDiv, '중복 체크에 실패했습니다. 다시 시도하세요.', 'text-danger');
            isNicknameAvailable = false;
        }
    });

    //핸드폰유ㅅ효성검사
    const phoneNumberInput = document.getElementById("phoneNumber");
    const phoneNumberCheckResult = document.getElementById("phoneNumberCheckResult");

    phoneNumberInput.addEventListener("input", function () {
        const phoneNumber = this.value.replace(/[^0-9]/g, ''); // 입력된 값에서 숫자만 남김
        const phonePattern = /^[0-9]{3}-?[0-9]{3,4}-?[0-9]{4}$/;

        // 핸드폰 유효성 검사
        if (!phonePattern.test(phoneNumber)) {
            phoneNumberCheckResult.textContent = '올바른 핸드폰 번호 형식이 아닙니다.';
            phoneNumberCheckResult.classList.add('text-danger');
            phoneNumberCheckResult.classList.remove('text-success');
        } else {
            phoneNumberCheckResult.textContent = '유효한 핸드폰 번호입니다.';
            phoneNumberCheckResult.classList.add('text-success');
            phoneNumberCheckResult.classList.remove('text-danger');
        }
    });
    // 휴대폰 번호 중복 체크
    document.getElementById("checkPhoneNumberBtn").addEventListener("click", async function () {
        const phoneNumberInput = document.getElementById("phoneNumber");
        const resultDiv = document.getElementById("phoneNumberCheckResult");
        const phoneNumber = phoneNumberInput.value.trim();

        const phonePattern = /^[0-9]{3}-?[0-9]{3,4}-?[0-9]{4}$/;

        if (!phonePattern.test(phoneNumber)) {
            updateResult(resultDiv, "올바른 휴대폰 번호를 입력해주세요.", "text-danger");
            isPhoneNumberAvailable = false;
            return;
        }

        try {
            const response = await fetch(`/users/register/phoneCheck?phoneNumber=${encodeURIComponent(phoneNumber)}`);
            if (!response.ok) {
                throw new Error('서버 요청에 실패했습니다.');
            }

            const isAvailable = await response.json();
            if (isAvailable) {
                updateResult(resultDiv, "사용 가능한 휴대폰 번호입니다.", "text-success");
                isPhoneNumberAvailable = true;

                // 입력란과 버튼 비활성화
                phoneNumberInput.readonly = true;
                this.readonly = true;
            } else {
                updateResult(resultDiv, "이미 사용 중인 휴대폰 번호입니다.", "text-danger");
                isPhoneNumberAvailable = false;
            }
        } catch (error) {
            updateResult(resultDiv, "중복 체크에 실패했습니다. 다시 시도하세요.", "text-danger");
            isPhoneNumberAvailable = false;
        }
    });

    // 폼 제출 시 중복 체크 확인
    document.querySelector("form").addEventListener("submit", function (event) {
        if (!isUsernameAvailable) {
            alert("아이디 중복 체크를 완료하세요.");
            document.getElementById('username').focus();
            event.preventDefault();
            return;
        }

        if (!isNicknameAvailable) {
            alert("닉네임 중복 체크를 완료하세요.");
            document.getElementById('nickname').focus();
            event.preventDefault();
            return;
        }

        if (!isPhoneNumberAvailable) {
            alert("휴대폰 번호 중복 체크를 완료하세요.");
            document.getElementById('phoneNumber').focus();
            event.preventDefault();
            return;
        }
        if (!isPasswordValid) {
            alert("비밀번호는 최소 8자 이상이어야 합니다.");
            passwordInput.focus();
            event.preventDefault();
            return;
        }

        alert("회원가입을 진행합니다.");
    });

    // 결과 메시지를 업데이트하는 헬퍼 함수
    function updateResult(element, message, className) {
        element.textContent = message;
        element.className = className;
        element.style.display = 'block';
    }
</script>
</body>
</html>
