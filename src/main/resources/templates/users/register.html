<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/common-header :: header" th:with="pageTitle='회원가입'"></head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">회원가입</h2>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <script src="/js/common.js"></script>

    <!-- 메시지 표시 -->
    <div th:if="${message}" class="alert alert-success" role="alert" th:text="${message}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

    <form th:action="@{/users/register}" th:object="${user}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">아이디</label>
            <input type="text" class="form-control" id="username" th:field="*{username}" placeholder="아이디를 입력하세요" required>
            <button type="button" id="checkUsernameBtn" class="btn btn-secondary mt-2">중복 체크</button>
            <div id="usernameCheckResult" class="mt-2"></div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="비밀번호를 입력하세요" required>
        </div>
        <div class="mb-3">
            <label for="phoneNumber" class="form-label">휴대폰 번호</label>
            <input
                    type="tel"
                    class="form-control"
                    id="phoneNumber"
                    name="phoneNumber"
                    placeholder="01012345678"
                    pattern="[0-9]{3}-?[0-9]{3,4}-?[0-9]{4}"
                    required
            >
            <div class="form-text">숫자 11자리를 입력해주세요. 예: 01012345678</div>
        </div>
        <button type="submit" class="btn btn-primary w-100">회원가입</button>
    </form>
</div>

<script>
    // 폼 제출 시 휴대폰 번호 검증
    document.querySelector("form").addEventListener("submit", function(event) {
        const phoneNumber = document.getElementById("phoneNumber").value;
        const phonePattern = /^[0-9]{3}-?[0-9]{3,4}-?[0-9]{4}$/;

        if (!phonePattern.test(phoneNumber)) {
            event.preventDefault();
            alert("올바른 휴대폰 번호를 입력해주세요. 예: 01012345678 또는 010-1234-5678");
        }
    });

    // 아이디 중복체크
    document.getElementById('checkUsernameBtn').addEventListener('click', function () {
        const username = document.getElementById('username').value;
        const resultDiv = document.getElementById('usernameCheckResult');

        if (!username) {
            resultDiv.textContent = '아이디를 입력하세요.';
            resultDiv.className = 'text-danger';
            return;
        }

        fetch(`/users/register/idCheck?username=${username}`)
            .then(response => response.json())
            .then(idIsFine => {
                if (idIsFine) {
                    resultDiv.textContent = '사용 가능한 아이디입니다.';
                    resultDiv.className = 'text-success';
                } else {
                    resultDiv.textContent = '이미 사용 중인 아이디입니다.';
                    resultDiv.className = 'text-danger';
                }
            })
            .catch(() => {
                resultDiv.textContent = '중복 체크에 실패했습니다. 다시 시도하세요.';
                resultDiv.className = 'text-danger';
            });
    });
</script>
</body>
</html>
