<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reviews</title>
</head>
<body>
<h1>Reviews for Club</h1>
<table>
    <tr>
        <th>Comment</th>
        <th>Rating</th>
    </tr>
    <tr th:each="review : ${reviews}">
        <td th:text="${review.comment}">Review Comment</td>
        <td th:text="${review.rating}">Review Rating</td>
    </tr>
</table>

<h2>Add New Review</h2>
<form th:action="@{/reviews}" method="post">
    <label>Comment: <input type="text" name="comment"/></label><br/>
    <label>Rating: <input type="number" name="rating" min="1" max="5"/></label><br/>
    <button type="submit">Add Review</button>
</form>
</body>
</html>
