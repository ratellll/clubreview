---
name: Deploy to EC2

on:
  push:
    branches:
      - main  # main 브랜치에 푸시될 때 워크플로우 실행

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2  # 코드 체크아웃

      - name: Print Environment Variables for Debugging
        run: |
          echo "==== Debugging GitHub Secrets ===="
          echo "EC2_HOST: ${{ secrets.EC2_HOST }}"
          echo "EC2_USER: ${{ secrets.EC2_USER }}"
          echo "APP_DIR: ${{ secrets.APP_DIR }}"
          echo "PRIVATE_KEY length: ${#secrets.PRIVATE_KEY}"

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          APP_DIR: ${{ secrets.APP_DIR }}
        run: |
          echo "==== SSH Key Setup ===="
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/id_ed25519  # 개인 키 저장
          chmod 600 ~/.ssh/id_ed25519  # 권한 설정
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts  # known_hosts에 호스트 추가

          echo "==== Create Remote Directory ===="
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "mkdir -p ${{ secrets.APP_DIR }}"

          echo "==== Upload Files to EC2 ===="
          scp -i ~/.ssh/id_ed25519 -r * \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.APP_DIR }}

          echo "==== Restart Application ===="
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} <<EOF
          sudo systemctl daemon-reload
          sudo systemctl restart clubreview.service
          EOF
