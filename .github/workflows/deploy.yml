---
name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          APP_DIR: ${{ secrets.APP_DIR }}
        run: |
          set -e
          set -x

          echo "==== SSH Key Setup ===="
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "Adding EC2 host to known_hosts..."
          if ! ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts; then
            echo "Error: ssh-keyscan failed for host ${{ secrets.EC2_HOST }}"
            exit 1
          fi

          echo "==== Test SSH Connection ===="
          if ! ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "echo 'SSH 연결 성공'"; then
            echo "Error: SSH 연결 실패!"
            exit 1
          fi

          echo "==== Create Remote Directory ===="
          if ! ssh -i ~/.ssh/id_ed25519 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "mkdir -p ${{ secrets.APP_DIR }}"; then
            echo "Error: Remote directory creation failed!"
            exit 1
          fi

          echo "==== Upload Files to EC2 ===="
          if ! scp -i ~/.ssh/id_ed25519 -r * \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.APP_DIR }}; then
            echo "Error: File upload failed!"
            exit 1
          fi

          echo "==== Restart Application ===="
          if ! ssh -i ~/.ssh/id_ed25519 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} <<EOF
          sudo systemctl daemon-reload
          sudo systemctl restart clubreview.service
          EOF
          then
            echo "Error: Application restart failed!"
            exit 1
          fi

          echo "Deployment completed successfully!"

