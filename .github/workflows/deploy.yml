---
name: Deploy to EC2

on:
  push:
    branches:
      - main  # main 브랜치에 push될 때 실행됨

jobs:
  deploy:
    runs-on: ubuntu-latest  # GitHub Actions 실행 환경 (Ubuntu 최신 버전)
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2  # GitHub에서 소스코드 체크아웃 (가져오기)

      - name: Set up JDK
        uses: actions/setup-java@v2  # Java 17 설정 (올바른 설정 적용)
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew  # Gradle 실행 권한 부여

      - name: Build JAR file
        run: ./gradlew clean bootJar --no-daemon  # 프로젝트 빌드 (JAR 파일 생성)

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}  # EC2 서버 주소 (GitHub Secrets에서 가져옴)
          EC2_USER: ${{ secrets.EC2_USER }}  # EC2 접속 사용자
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}  # SSH 비밀키 (GitHub Secrets에 저장된 값)
          APP_DIR: ${{ secrets.APP_DIR }}  # EC2에서 애플리케이션이 배포될 디렉토리
        run: |
          set -e  # 에러 발생 시 즉시 스크립트 중단
          set -x  # 실행되는 명령어 로그 출력

          echo "==== SSH Key Setup ===="
          mkdir -p ~/.ssh  # SSH 키 저장 폴더 생성
          echo "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/id_ed25519  # SSH 개인 키 생성
          chmod 600 ~/.ssh/id_ed25519  # 키 파일 권한 설정

          echo "Adding EC2 host to known_hosts..."
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts  # EC2 서버를 SSH 신뢰 목록에 추가

          echo "==== Upload JAR file to EC2 ===="
          JAR_FILE=$(ls -t build/libs/*.jar | head -n1)  # 가장 최근 빌드된 JAR 파일 가져오기
          scp -i ~/.ssh/id_ed25519 "$JAR_FILE" \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.APP_DIR }}/clubreview-0.0.1-SNAPSHOT.jar
          # 생성된 JAR 파일을 EC2의 지정된 경로로 복사

          echo "==== Restart Application ===="
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} <<EOF
          sudo systemctl daemon-reload  # 서비스 설정 다시 불러오기
          sudo systemctl restart clubreview.service  # Spring Boot 애플리케이션 재시작
          EOF

          echo "Deployment completed successfully!"  # 배포 완료 메시지 출력
